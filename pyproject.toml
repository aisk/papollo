[project]
name = "papollo"
version = "0.1.0"
description = "Python client for Apollo config center, with sync and async support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "An Long", email = "aisk1988@gmail.com" }]
keywords = ["apollo", "config", "configuration", "config-center", "asyncio", "httpx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "typing-extensions>=4.0 ; python_full_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/aisk/papollo"
Repository = "https://github.com/aisk/papollo"
Issues = "https://github.com/aisk/papollo/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
