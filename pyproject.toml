[project]
name = "papollo"
version = "0.1.0"
description = "Python client for Apollo config center, with sync and async support"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
